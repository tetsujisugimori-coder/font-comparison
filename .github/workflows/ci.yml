name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-font-analysis.txt
      - name: Check JavaScript syntax
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run JavaScript tests
        run: node --test *.test.js
      - name: Check Python syntax
        run: python -m py_compile analyze_font_cmap.py analyze_google_fonts.py
      - name: Run fixture-only Google Fonts tests
        run: python -m unittest test_analyze_google_fonts.py
      - name: Check whitespace
        run: git diff --check
