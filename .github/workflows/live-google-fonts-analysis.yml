name: Live web font analysis

on:
  workflow_dispatch:
    inputs:
      run_live_analysis:
        description: Run live Web font analysis (no commit or push)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-font-live-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: inputs.run_live_analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-font-analysis.txt
      - name: Analyze current Web font CSS, WOFF2, and fixed Source Han files
        run: |
          mkdir artifacts
          cp font-opentype-data.js artifacts/font-opentype-data.js
          cp font-coverage-data.js artifacts/font-coverage-data.js
          python analyze_google_fonts.py --output artifacts/font-opentype-data.js --coverage-output artifacts/font-coverage-data.js | tee artifacts/analysis-summary.txt
          git diff --no-index -- font-opentype-data.js artifacts/font-opentype-data.js || true
          git diff --no-index -- font-coverage-data.js artifacts/font-coverage-data.js || true
      - uses: actions/upload-artifact@v4
        with:
          name: web-font-analysis-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
